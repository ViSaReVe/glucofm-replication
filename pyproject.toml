[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "glucofm-reimplementation"
version = "0.1.0"
description = "Unofficial, documented PyTorch implementation of GlucoFM v1"
requires-python = ">=3.10"
dependencies = ["torch>=2.2", "numpy>=1.24", "scikit-learn>=1.3"]

[project.optional-dependencies]
dev = ["pytest>=8", "matplotlib>=3.7"]

[project.scripts]
glucofm = "glucofm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
